# Fotos/videos que el bot puede mandar con la herramienta send_product_media.
# Los archivos están en public/media/ de este repo y se sirven en
# https://caim.13.140.35.117.sslip.io/media/<archivo> (la propia app los sirve, no GitHub).
products:
  # Tutorial de uso de la RCAIM 56: se manda SOLO con el comando manual
  # /tutorcaim (vos lo escribís en la app) — la IA nunca llama a esto, no
  # está disponible como send_product_media. Orden fijo: 1 a 5. Cada video
  # lleva la descripción de su nombre de archivo original, excepto el 2
  # ("DESCRIPCION GRANDE"), que lleva el texto del tablero/temperatura en
  # vez del nombre.
